apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-service
  labels:
    app: database-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-service
  template:
    metadata:
      labels:
        app: database-service
    spec:
      containers:
      - name: database-service
        image: registry.redhat.io/rhel8/mysql80:latest
        ports:
        - containerPort: 3306
        envFrom:
        - configMapRef:
            name: user-service-config

